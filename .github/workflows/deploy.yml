name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Assert build artefact
        run: test -d dist/client

      - name: No secrets in dist
        run: |
          if grep -rE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{16,}|BEGIN [A-Z ]*PRIVATE' dist; then
            echo "Possible secret material in dist" >&2
            exit 1
          fi

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke production
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null https://blog.pixelium.win/
          curl -sI https://blog.pixelium.win/ | grep -qi 'strict-transport-security'

      - name: Notify Telegram on failure
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Même fix que pixelium-site (audit sécu Grok #18, P3) : message
          # tronqué + Markdown legacy échappé, --data-urlencode plutôt que -d
          # brut (un "&"/"%" littéral dans le commit corromprait sinon le corps
          # de la requête).
          SAFE_MSG=$(printf '%s' "$COMMIT_MSG" | cut -c1-300 | sed -e 's/[_*`[]/\\&/g')
          TEXT=$(printf '⚠️ *Deploy blog.pixelium.win FAILED*\n\nCommit: `%s`\nMessage: %s\nVoir le run: %s' \
            "${GITHUB_SHA::7}" "$SAFE_MSG" "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode=Markdown \
            --data-urlencode "text=${TEXT}"
