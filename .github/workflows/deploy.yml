name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true # suit la dernière 22.x, pas le cache du runner (astro ≥ 7.4.2 : node ≥ 22.23.4)
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Assert build artefact
        run: test -d dist/client

      - name: No secrets in dist
        run: |
          if grep -rE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{16,}|BEGIN [A-Z ]*PRIVATE' dist; then
            echo "Possible secret material in dist" >&2
            exit 1
          fi

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke production
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null https://blog.pixelium.win/
          curl -sI https://blog.pixelium.win/ | grep -qi 'strict-transport-security'

      # Pas d'étape de notification : un deploy en échec est relevé depuis le homelab par
      # le DAG `gh-actions-watch` (CT 246, infra/homelab), qui publie sur ntfy. L'ancienne
      # étape Telegram est retirée le 2026-10-25 : canal mort depuis le 23/10.
