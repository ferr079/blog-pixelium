name = "blog-pixelium"
compatibility_date = "2026-10-13" # alignée sur pixelium-site (le blog était resté au 2025-04-01)
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "blog.pixelium.win", custom_domain = true }
]

[assets]
directory = "dist"
# Sans ce réglage, une URL inconnue renvoie une 404 vide (0 o) alors que
# dist/404.html existe (blog-pixelium#79).
not_found_handling = "404-page"

# Workers Logs — même correctif que sur pixelium-site (2026-08-16) : sans ce
# bloc, `observability` reste à null côté API et rien n'est persisté. Le blog
# est du statique, donc peu de logs applicatifs, mais c'est aussi ce qui rend
# une anomalie (404 en rafale, erreur d'asset) invisible faute de trace.
[observability]
enabled = true
